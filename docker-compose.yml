# เริ่มใช้งาน:  docker compose up --build   แล้วเปิด http://127.0.0.1:8000
# บน Linux ให้ไฟล์ผลลัพธ์เป็นของผู้ใช้ปัจจุบัน:  OCR_UID=$(id -u) OCR_GID=$(id -g) docker compose up --build
services:
  workbench:
    build: .
    image: ocr-workbench:cpu
    user: "${OCR_UID:-0}:${OCR_GID:-0}"
    ports:
      # เปิดให้เข้าได้จากเครื่องนี้เท่านั้น เปลี่ยนพอร์ตด้วย OCR_PORT=8001
      - "127.0.0.1:${OCR_PORT:-8000}:8000"
    volumes:
      - ./images:/app/images
      - ./GroundTruthDraft:/app/GroundTruthDraft
      - ./GroundTruth:/app/GroundTruth
      - ./evaluation_output:/app/evaluation_output
      - ./experiment_output:/app/experiment_output
      - ./experiments:/app/experiments
      # โมเดล OCR ที่ดาวน์โหลดแล้ว และประวัติงาน/บันทึกของหน้าเว็บ
      - ./.ocr_cache:/app/.ocr_cache
      - ./.webui:/app/.webui
    restart: unless-stopped
